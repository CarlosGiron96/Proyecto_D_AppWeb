{% extends "base.html" %}

{% block title %}Módulo de Proveedores{% endblock %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 fw-bold"><i class="bi bi-box-seam text-warning"></i> Catálogo de Productos</h2>
    <a href="{{ url_for('nuevo_producto') }}" class="btn btn-success fw-bold rounded-3">
        <i class="bi bi-plus-circle"></i> Nuevo Producto
    </a>
</div>
{% block content %}
<div class="card p-4 border-0 shadow-sm rounded-4 bg-white">
    <h2 class="h4 fw-bold mb-3"><i class="bi bi-truck text-warning"></i> Directorio de Proveedores</h2>
    <ul class="list-group">
        {% for p in proveedores %}
        <li class="list-group-item d-flex justify-content-between align-items-center p-3">
            <div>
                <h6 class="fw-bold mb-0">{{ p.finca }}</h6>
                <small class="text-muted">Región: {{ p.region }}</small>
            </div>
            <span class="badge bg-warning text-dark">{{ p.tipo_grano }}</span>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
