{% extends "base.html" %}

{% block title %}Módulo de Clientes{% endblock %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 fw-bold"><i class="bi bi-box-seam text-warning"></i> Catálogo de Productos</h2>
    <a href="{{ url_for('nuevo_producto') }}" class="btn btn-success fw-bold rounded-3">
        <i class="bi bi-plus-circle"></i> Nuevo Producto
    </a>
</div>
{% block content %}
<div class="card p-4 border-0 shadow-sm rounded-4 bg-white">
    <h2 class="h4 fw-bold mb-3"><i class="bi bi-people-fill text-warning"></i> Gestión de Clientes</h2>
    <div class="row g-3">
        {% for c in clientes %}
        <div class="col-md-6">
            <div class="p-3 border rounded-3 bg-light">
                <h5 class="fw-bold text-dark mb-1">{{ c.nombre }}</h5>
                <p class="mb-1 text-muted small"><strong>Ciudad:</strong> {{ c.ciudad }}</p>
                <p class="mb-0 text-muted small"><strong>Contacto:</strong> {{ c.contacto }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
