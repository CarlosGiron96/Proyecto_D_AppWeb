{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="p-5 mb-4 bg-light rounded-3 shadow-sm">
        <div class="container-fluid py-3">
            <h1 class="display-5 fw-bold text-dark">Panel de Control (Dashboard)</h1>
            <p class="col-md-8 fs-4 text-muted">Sesión activa como: <strong>{{ current_user.nombre }}</strong> (@{{ current_user.username }})</p>
            <hr class="my-4">
            <a class="btn btn-warning btn-lg fw-bold text-dark" href="{{ url_for('productos') }}" role="button">
                <i class="bi bi-box-seam"></i> Gestionar Productos
            </a>
        </div>
    </div>
</div>
{% endblock %}
